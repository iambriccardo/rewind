<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rewind Phone Simulator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101413;
        color: #eef3ef;
      }
      body {
        margin: 0;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
        gap: 18px;
        padding: 18px;
        min-height: calc(100vh - 36px);
      }
      section,
      aside {
        min-width: 0;
      }
      .camera {
        position: relative;
        overflow: hidden;
        border: 1px solid #2b3733;
        background: #050706;
        aspect-ratio: 4 / 3;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scaleX(-1);
      }
      .placeholder {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #8fa098;
        text-align: center;
        padding: 24px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .toolbar {
        flex-wrap: wrap;
      }
      .toolbar[hidden] {
        display: none;
      }
      input,
      button {
        border: 1px solid #34433e;
        background: #18201d;
        color: #eef3ef;
        min-height: 40px;
        border-radius: 6px;
        font: inherit;
      }
      input {
        flex: 1;
        padding: 0 12px;
      }
      input[type="number"] {
        flex: 0 0 auto;
        width: 68px;
      }
      button {
        padding: 0 12px;
        cursor: pointer;
      }
      button:disabled,
      input:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }
      .setting {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 40px;
        color: #c8d7d0;
        font-size: 13px;
        white-space: nowrap;
      }
      button.primary {
        background: #2f7d5a;
        border-color: #3d9e72;
      }
      button.active {
        background: #26342f;
        border-color: #6e8a7d;
      }
      .status {
        margin-top: 12px;
        border: 1px solid #34433e;
        background: #121916;
        color: #c8d7d0;
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 13px;
      }
      .status[data-state="offline"] {
        border-color: #9b5555;
        color: #ffc9c9;
        background: #1f1212;
      }
      .status[data-state="checking"] {
        border-color: #9b8d51;
        color: #f0dfa6;
      }
      .status[data-state="ready"],
      .status[data-state="streaming"] {
        border-color: #3d9e72;
        color: #c9f5dc;
      }
      .search-panel {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        margin-bottom: 12px;
      }
      .search-panel input {
        width: 100%;
        min-width: 0;
      }
      .log,
      .tools,
      .playback,
      .summary,
      .results,
      .dev-protocol {
        border: 1px solid #2b3733;
        background: #121916;
        padding: 10px;
        overflow: auto;
      }
      .log,
      .tools {
        height: 38vh;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        white-space: pre-wrap;
      }
      .tools {
        height: 26vh;
        margin-bottom: 12px;
      }
      .summary {
        min-height: 56px;
        margin-bottom: 12px;
      }
      .summary strong,
      .memory-card strong {
        display: block;
        margin-bottom: 4px;
      }
      .summary small,
      .memory-card small,
      .empty {
        color: #9aaca4;
      }
      .summary[data-tone="ok"] {
        border-color: #3d9e72;
      }
      .summary[data-tone="busy"] {
        border-color: #9b8d51;
      }
      .summary[data-tone="error"] {
        border-color: #9b5555;
      }
      .results {
        display: grid;
        gap: 8px;
        max-height: 28vh;
        margin-bottom: 12px;
      }
      .memory-card {
        border: 1px solid #2b3733;
        background: #0d1210;
        color: inherit;
        text-align: left;
        padding: 10px;
        min-height: auto;
        cursor: pointer;
      }
      .memory-card:hover,
      .memory-card.active {
        border-color: #3d9e72;
      }
      .memory-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .pill {
        border: 1px solid #34433e;
        color: #c8d7d0;
        padding: 2px 6px;
        font-size: 12px;
      }
      .playback {
        margin-top: 12px;
        min-height: 240px;
      }
      .player {
        position: relative;
        overflow: hidden;
        background: #050706;
        border: 1px solid #2b3733;
        aspect-ratio: 4 / 3;
        display: grid;
        place-items: center;
      }
      .player img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 180ms ease;
      }
      .player img.visible {
        opacity: 1;
      }
      .player .empty {
        padding: 18px;
        text-align: center;
      }
      .playback-info {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 2px 0;
        color: #c8d7d0;
        font-size: 13px;
      }
      .playback-info strong {
        display: block;
        color: #eef3ef;
      }
      .frame-list {
        margin-top: 10px;
        min-height: 180px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
        max-height: 34vh;
        overflow: auto;
      }
      .frame-row {
        border: 1px solid #2b3733;
        background: #0a0d0c;
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 8px;
        padding: 6px;
        color: inherit;
        text-align: left;
        min-height: 64px;
        cursor: pointer;
      }
      .frame-row.active {
        border-color: #3d9e72;
        background: #102018;
      }
      .frame-row img {
        width: 100%;
        height: 54px;
        object-fit: cover;
        display: block;
      }
      .frame-row small {
        display: block;
        color: #a9bbb2;
        overflow-wrap: anywhere;
      }
      .frame-time {
        color: #6f8279;
        font-size: 12px;
        margin-top: 4px;
      }
      .dev-protocol {
        margin-top: 12px;
      }
      .dev-protocol summary {
        cursor: pointer;
        color: #c8d7d0;
      }
      .dev-protocol .tools,
      .dev-protocol .log {
        margin-top: 10px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px;
        font-weight: 650;
      }
      @media (max-width: 820px) {
        main {
          grid-template-columns: 1fr;
          padding: 12px;
          min-height: calc(100vh - 24px);
        }
        .log {
          height: 28vh;
        }
        .search-panel {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Rewind Phone Simulator</h1>
        <div class="camera">
          <video id="video" autoplay playsinline muted></video>
        <div id="placeholder" class="placeholder">Start streaming to share camera and microphone.</div>
        </div>
        <div id="status" class="status" data-state="checking">Checking backend...</div>
        <div class="toolbar">
          <button id="stream" class="primary">Start Streaming</button>
        </div>
        <div id="streamControls" class="toolbar" hidden>
          <button id="hideVideo">Hide Camera</button>
          <button id="muteAudio">Mute Mic</button>
          <label class="setting">
            Frame every
            <input id="frameInterval" type="number" min="1" max="60" step="1" />
            s
          </label>
        </div>
      </section>
      <aside>
        <h1>Rewind</h1>
        <div id="summary" class="summary">
          <strong>Ready</strong>
          <small>Waiting for a save or search request.</small>
        </div>
        <form id="searchForm" class="search-panel">
          <input id="searchInput" type="search" autocomplete="off" placeholder="Search memories" />
          <button id="searchButton" type="submit">Search</button>
        </form>
        <h1>Results</h1>
        <div id="results" class="results">
          <div class="empty">No memories yet.</div>
        </div>
        <h1>Playback</h1>
        <div id="playback" class="playback">
          <div id="player" class="player">
            <div class="empty">Search results will play here.</div>
          </div>
          <div id="playbackInfo" class="playback-info"></div>
          <div id="frameList" class="frame-list"></div>
        </div>
        <details id="devDetails" class="dev-protocol">
          <summary>Dev protocol JSON</summary>
          <div id="tools" class="tools"></div>
          <div id="log" class="log"></div>
        </details>
      </aside>
    </main>
    <canvas id="canvas" width="640" height="480" hidden></canvas>
    <script src="/env.js"></script>
    <script>
      const DEFAULT_REALTIME_IMAGE_INTERVAL_SECONDS = 1;
      const MIN_REALTIME_IMAGE_INTERVAL_SECONDS = 1;
      const MAX_REALTIME_IMAGE_INTERVAL_SECONDS = 60;
      const LOCAL_FRAME_CAPTURE_INTERVAL_MS = 1000;
      const FRAME_BUFFER_DURATION_MS = 60_000;
      const DEFAULT_REWIND_CAPTURE_DURATION_SECONDS = 8;
      const FRAME_BUFFER_MAX_FRAMES = Math.ceil(FRAME_BUFFER_DURATION_MS / LOCAL_FRAME_CAPTURE_INTERVAL_MS);
      const MAX_FRAME_EDGE_PX = 384;
      const FRAME_JPEG_QUALITY = 0.62;
      const AUDIO_SAMPLE_RATE = 16000;
      const AUDIO_CHUNK_MS = 250;
      const AUDIO_CHUNK_SAMPLE_COUNT = Math.round((AUDIO_SAMPLE_RATE * AUDIO_CHUNK_MS) / 1000);
      const BACKEND_HEALTH_INTERVAL_MS = 2500;
      const PLAYBACK_INTERVAL_MS = 450;
      const DEFAULT_BACKEND_URL = 'http://localhost:8787';
      const webConfig = window.REWIND_WEB_CONFIG || {};

      const state = {
        ws: null,
        connectPromise: null,
        sessionId: null,
        buffer: [],
        assets: new Map(),
        streaming: false,
        mediaStream: null,
        frameStreamTimer: null,
        localCaptureTimer: null,
        mediaSeq: 0,
        audioStreamer: null,
        persistedFrames: new Set(),
        framePersistPromises: new Map(),
        frameStoreErrorLogged: false,
        videoHidden: false,
        audioMuted: false,
        frameIntervalSeconds: readFrameIntervalSeconds(),
        backendReady: false,
        backendChecking: false,
        searchBusy: false,
        playbackFrames: [],
        playbackIndex: 0,
        playbackTimer: null,
        activePlaybackMemory: null
      };

      const els = {
        video: document.getElementById('video'),
        placeholder: document.getElementById('placeholder'),
        canvas: document.getElementById('canvas'),
        stream: document.getElementById('stream'),
        streamControls: document.getElementById('streamControls'),
        hideVideo: document.getElementById('hideVideo'),
        muteAudio: document.getElementById('muteAudio'),
        frameInterval: document.getElementById('frameInterval'),
        searchForm: document.getElementById('searchForm'),
        searchInput: document.getElementById('searchInput'),
        searchButton: document.getElementById('searchButton'),
        status: document.getElementById('status'),
        summary: document.getElementById('summary'),
        results: document.getElementById('results'),
        devDetails: document.getElementById('devDetails'),
        log: document.getElementById('log'),
        tools: document.getElementById('tools'),
        player: document.getElementById('player'),
        playbackInfo: document.getElementById('playbackInfo'),
        frameList: document.getElementById('frameList')
      };

      els.frameInterval.value = String(state.frameIntervalSeconds);
      els.stream.disabled = true;
      els.stream.textContent = 'Backend unavailable';

      function log(message, payload) {
        const line = `[${new Date().toLocaleTimeString()}] ${message}${payload ? `\n${JSON.stringify(payload, null, 2)}` : ''}\n`;
        els.log.textContent = line + els.log.textContent;
      }

      function protocolLog(kind, payload) {
        const line = `[${new Date().toLocaleTimeString()}] ${kind}\n${JSON.stringify(payload, null, 2)}\n\n`;
        els.tools.textContent = line + els.tools.textContent;
      }

      function setStatus(message, stateName = '') {
        els.status.textContent = message;
        if (stateName) els.status.dataset.state = stateName;
      }

      function setSummary(title, detail = '', tone = '') {
        els.summary.dataset.tone = tone;
        els.summary.innerHTML = '';
        const strong = document.createElement('strong');
        strong.textContent = title;
        els.summary.appendChild(strong);
        if (detail) {
          const small = document.createElement('small');
          small.textContent = detail;
          els.summary.appendChild(small);
        }
      }

      function renderSavedMemory(request, frameCount, status) {
        els.results.innerHTML = '';
        const card = memoryCard({
          title: request.title,
          description: request.description,
          meta: [
            `${frameCount} frames`,
            `${request.rewind_duration_seconds || 0}s`,
            status
          ]
        });
        els.results.appendChild(card);
      }

      function renderSearchResults(message) {
        els.results.innerHTML = '';
        if (!message.results.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = `No memories found for "${message.query}".`;
          els.results.appendChild(empty);
          renderTimeline([]);
          return;
        }

        message.results.forEach((result, index) => {
          const score = result.score?.similarity ?? result.score?.text_rank;
          const meta = [
            `${result.frame_refs?.length || 0} frames`,
            score == null ? null : `score ${Number(score).toFixed(2)}`,
            result.location_hint || null
          ].filter(Boolean);
          const card = memoryCard({
            title: result.title,
            description: result.description,
            meta,
            active: index === 0,
            onClick: () => {
              for (const item of els.results.querySelectorAll('.memory-card')) item.classList.remove('active');
              card.classList.add('active');
              renderTimeline(result.frame_refs || []);
              setSummary(result.title, result.description, 'ok');
            }
          });
          els.results.appendChild(card);
        });
        renderTimeline(message.results[0]?.frame_refs || []);
      }

      function memoryCard({ title, description, meta = [], active = false, onClick }) {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = `memory-card${active ? ' active' : ''}`;
        if (onClick) card.onclick = onClick;

        const strong = document.createElement('strong');
        strong.textContent = title || 'Untitled rewind';
        card.appendChild(strong);

        const small = document.createElement('small');
        small.textContent = description || '';
        card.appendChild(small);

        if (meta.length) {
          const row = document.createElement('div');
          row.className = 'memory-meta';
          for (const value of meta) {
            const pill = document.createElement('span');
            pill.className = 'pill';
            pill.textContent = value;
            row.appendChild(pill);
          }
          card.appendChild(row);
        }
        return card;
      }

      function clampFrameIntervalSeconds(value) {
        const seconds = Number.parseInt(value, 10);
        if (!Number.isFinite(seconds)) return DEFAULT_REALTIME_IMAGE_INTERVAL_SECONDS;
        return Math.min(MAX_REALTIME_IMAGE_INTERVAL_SECONDS, Math.max(MIN_REALTIME_IMAGE_INTERVAL_SECONDS, seconds));
      }

      function readFrameIntervalSeconds() {
        return clampFrameIntervalSeconds(localStorage.getItem('rewind_frame_interval_seconds'));
      }

      function currentFrameIntervalMs() {
        return state.frameIntervalSeconds * 1000;
      }

      function updateFrameInterval() {
        state.frameIntervalSeconds = clampFrameIntervalSeconds(els.frameInterval.value);
        els.frameInterval.value = String(state.frameIntervalSeconds);
        localStorage.setItem('rewind_frame_interval_seconds', String(state.frameIntervalSeconds));
        if (state.streaming && !state.videoHidden) {
          scheduleFrameStreaming();
          log('Realtime frame interval updated', { seconds: state.frameIntervalSeconds });
        }
      }

      function describeMediaError(error) {
        if (error?.message === 'permission-timeout') {
          return 'The browser did not answer the permission request. Check for a camera/mic prompt in the browser chrome, or open the phone app from npm run web at http://localhost:8788/phone.html.';
        }
        if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
          return 'Camera/mic requires localhost or HTTPS. Use npm run web locally, or use HTTPS for a phone/LAN URL.';
        }
        if (error?.name === 'NotAllowedError') {
          return 'Permission was denied or blocked. Check browser site settings for camera/microphone access.';
        }
        if (error?.name === 'NotFoundError') {
          return 'No matching camera/microphone device was found.';
        }
        if (error?.name === 'NotReadableError') {
          return 'The device is already in use by another app or browser tab.';
        }
        return error?.message || String(error);
      }

      async function reportMediaReadiness() {
        const details = {
          url: location.href,
          secure_context: window.isSecureContext,
          media_devices_api: Boolean(navigator.mediaDevices?.getUserMedia),
          audio_context_api: Boolean(window.AudioContext || window.webkitAudioContext)
        };
        try {
          if (navigator.permissions?.query) {
            const camera = await navigator.permissions.query({ name: 'camera' });
            const microphone = await navigator.permissions.query({ name: 'microphone' });
            details.camera_permission = camera.state;
            details.microphone_permission = microphone.state;
          }
        } catch {
          details.permission_query = 'unavailable';
        }
        log('Media readiness', details);
      }

      function wsUrl() {
        const backendUrl = new URL(webConfig.BACKEND_URL || DEFAULT_BACKEND_URL);
        const proto = backendUrl.protocol === 'https:' ? 'wss:' : 'ws:';
        const params = new URLSearchParams({
          user_id: webConfig.DEV_USER_ID || '00000000-0000-4000-8000-000000000001',
          device_id: webConfig.DEV_DEVICE_ID || 'dev-phone'
        });
        return `${proto}//${backendUrl.host}/v1/live?${params}`;
      }

      function backendHttpUrl(path) {
        return new URL(path, webConfig.BACKEND_URL || DEFAULT_BACKEND_URL).toString();
      }

      function sessionHelloMessage() {
        return {
          type: 'session.hello',
          protocol_version: 1,
          timestamp: new Date().toISOString(),
          device: {
            id: webConfig.DEV_DEVICE_ID || 'dev-phone',
            kind: 'web-demo',
            label: 'Rewind phone simulator'
          },
          buffers: {
            rewind: {
              duration_ms: FRAME_BUFFER_DURATION_MS,
              frame_interval_ms: LOCAL_FRAME_CAPTURE_INTERVAL_MS,
              max_frames: FRAME_BUFFER_MAX_FRAMES
            },
            realtime: {
              image_interval_ms: currentFrameIntervalMs(),
              audio_chunk_ms: AUDIO_CHUNK_MS,
              audio_sample_rate_hz: AUDIO_SAMPLE_RATE
            }
          },
          capabilities: {
            out_of_band_rewind_upload: true,
            local_frame_store: true,
            image_upload_for_embedding: true,
            manual_search: true
          }
        };
      }

      function setBackendAvailability(ready, detail = '') {
        state.backendReady = ready;
        if (!ready) {
          if (state.streaming) forceStopStreaming('Backend disconnected.');
          if (state.ws && state.ws.readyState === WebSocket.OPEN) state.ws.close();
          setStatus(detail || 'Backend unavailable. Start the backend before streaming.', 'offline');
        } else if (!state.streaming && (!state.ws || state.ws.readyState !== WebSocket.OPEN)) {
          setStatus(detail || 'Backend ready. Streaming can start.', 'ready');
        }
        updateStreamingControls();
      }

      function updateStreamingControls() {
        const canUseStream = state.backendReady && !state.backendChecking;
        els.stream.disabled = !canUseStream;
        if (!canUseStream) {
          els.stream.textContent = state.backendChecking ? 'Checking Backend' : 'Backend unavailable';
        } else {
          els.stream.textContent = state.streaming ? 'Stop Streaming' : 'Start Streaming';
        }
        const controlsDisabled = !canUseStream || !state.streaming;
        els.hideVideo.disabled = controlsDisabled;
        els.muteAudio.disabled = controlsDisabled;
        els.frameInterval.disabled = !canUseStream;
        els.searchInput.disabled = !canUseStream || state.searchBusy;
        els.searchButton.disabled = !canUseStream || state.searchBusy || !els.searchInput.value.trim();
        els.searchButton.textContent = state.searchBusy ? 'Searching' : 'Search';
      }

      async function checkBackendHealth() {
        if (state.backendChecking) return;
        state.backendChecking = true;
        updateStreamingControls();
        try {
          const response = await fetch(backendHttpUrl('/health'), { cache: 'no-store' });
          if (!response.ok) throw new Error(`health ${response.status}`);
          const health = await response.json();
          setBackendAvailability(Boolean(health.ok), `Backend ready · ${health.storage?.repository || 'unknown storage'}`);
        } catch (error) {
          setBackendAvailability(false, `Backend disconnected · ${error.message || String(error)}`);
        } finally {
          state.backendChecking = false;
          updateStreamingControls();
        }
      }

      function connect() {
        if (!state.backendReady) {
          throw new Error('Backend is not connected. Start the backend before streaming.');
        }
        if (state.ws?.readyState === WebSocket.OPEN && state.sessionId) return Promise.resolve();
        if (state.connectPromise) return state.connectPromise;
        state.sessionId = null;
        state.ws = new WebSocket(wsUrl());
        let rejectReady = null;
        state.connectPromise = new Promise((resolve, reject) => {
          rejectReady = reject;
          state.ws.onopen = () => {
            setStatus('Realtime handshaking', 'checking');
            log('WebSocket connected');
            sendSessionHello();
            updateStreamingControls();
          };
          state.ws.onmessage = (event) => {
            const message = JSON.parse(event.data);
            handleServerMessage(message);
            if (message.type === 'session.ready') {
              state.connectPromise = null;
              resolve();
            }
          };
          state.ws.onerror = () => {
            log('WebSocket error');
            state.connectPromise = null;
            checkBackendHealth();
            reject(new Error('WebSocket error'));
          };
        });
        state.ws.onclose = () => {
          if (state.streaming) forceStopStreaming('Realtime socket disconnected.');
          if (state.connectPromise && rejectReady) rejectReady(new Error('Realtime socket disconnected during handshake.'));
          state.sessionId = null;
          state.connectPromise = null;
          setStatus(state.backendReady ? 'Realtime disconnected. Streaming can restart.' : 'Backend disconnected.', state.backendReady ? 'ready' : 'offline');
          log('WebSocket disconnected');
          updateStreamingControls();
        };
        return state.connectPromise;
      }

      function sendSessionHello() {
        send(sessionHelloMessage());
      }

      async function startStreaming() {
        if (!state.backendReady) {
          await checkBackendHealth();
          if (!state.backendReady) throw new Error('Backend is not connected. Start the backend before streaming.');
        }
        if (state.streaming) {
          stopStreaming();
          return;
        }
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error('Camera/microphone API unavailable in this browser context.');
        }
        if (!window.AudioContext && !window.webkitAudioContext) {
          throw new Error('Web Audio API unavailable in this browser context.');
        }
        await connect();
        setStatus('Requesting camera and microphone permission...');
        els.stream.disabled = true;
        const stream = await withTimeout(
          navigator.mediaDevices.getUserMedia({
            video: {
              width: { ideal: MAX_FRAME_EDGE_PX },
              height: { ideal: Math.round((MAX_FRAME_EDGE_PX * 3) / 4) },
              frameRate: { ideal: 10, max: 15 },
              facingMode: 'environment'
            },
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          }),
          10000
        );
        reportMediaReadiness();
        state.mediaStream = stream;
        els.video.srcObject = stream;
        await els.video.play();
        state.streaming = true;
        state.videoHidden = false;
        state.audioMuted = false;
        els.placeholder.style.display = 'none';
        els.streamControls.hidden = false;
        updateStreamControls();
        updateStreamingControls();
        setStatus('Streaming camera and microphone', 'streaming');
        captureFrame();
        scheduleLocalCapture();
        sendFrameToAgent();
        scheduleFrameStreaming();
        await startAudioStreaming(stream);
      }

      function stopStreaming() {
        if (state.frameStreamTimer || state.localCaptureTimer) {
          clearFrameTimers();
          send({ type: 'user.media_end', modality: 'image' });
        }
        if (stopAudioStreaming()) {
          send({ type: 'user.media_end', modality: 'audio' });
        }
        state.mediaStream?.getTracks().forEach((track) => track.stop());
        state.mediaStream = null;
        state.streaming = false;
        state.videoHidden = false;
        state.audioMuted = false;
        els.video.srcObject = null;
        els.video.style.visibility = 'visible';
        els.placeholder.style.display = 'grid';
        els.streamControls.hidden = true;
        updateStreamingControls();
        setStatus(state.backendReady ? 'Streaming stopped. Backend ready.' : 'Backend disconnected.', state.backendReady ? 'ready' : 'offline');
      }

      function forceStopStreaming(reason) {
        clearFrameTimers();
        stopAudioStreaming();
        state.mediaStream?.getTracks().forEach((track) => track.stop());
        state.mediaStream = null;
        state.streaming = false;
        state.videoHidden = false;
        state.audioMuted = false;
        els.video.srcObject = null;
        els.video.style.visibility = 'visible';
        els.placeholder.style.display = 'grid';
        els.placeholder.textContent = reason || 'Streaming stopped.';
        els.streamControls.hidden = true;
        updateStreamingControls();
      }

      function clearFrameTimers() {
        if (state.frameStreamTimer) {
          clearInterval(state.frameStreamTimer);
          state.frameStreamTimer = null;
        }
        if (state.localCaptureTimer) {
          clearInterval(state.localCaptureTimer);
          state.localCaptureTimer = null;
        }
      }

      function scheduleLocalCapture() {
        if (state.localCaptureTimer) clearInterval(state.localCaptureTimer);
        state.localCaptureTimer = setInterval(() => {
          if (state.streaming && !state.videoHidden) captureFrame();
        }, LOCAL_FRAME_CAPTURE_INTERVAL_MS);
      }

      function scheduleFrameStreaming() {
        if (state.frameStreamTimer) clearInterval(state.frameStreamTimer);
        state.frameStreamTimer = setInterval(sendFrameToAgent, currentFrameIntervalMs());
      }

      function captureFrame() {
        const ctx = els.canvas.getContext('2d');
        if (state.streaming && !state.videoHidden && els.video.videoWidth) {
          const scale = Math.min(1, MAX_FRAME_EDGE_PX / Math.max(els.video.videoWidth, els.video.videoHeight));
          els.canvas.width = Math.max(1, Math.round(els.video.videoWidth * scale));
          els.canvas.height = Math.max(1, Math.round(els.video.videoHeight * scale));
          ctx.drawImage(els.video, 0, 0, els.canvas.width, els.canvas.height);
        } else {
          ctx.fillStyle = `hsl(${Math.floor(Math.random() * 360)} 34% 25%)`;
          ctx.fillRect(0, 0, els.canvas.width, els.canvas.height);
          ctx.fillStyle = '#eef3ef';
          ctx.font = '28px system-ui';
          ctx.fillText(new Date().toLocaleTimeString(), 24, 54);
          ctx.font = '18px system-ui';
          ctx.fillText('local frame', 24, 92);
        }
        const frame = {
          uuid: crypto.randomUUID(),
          capturedAt: new Date().toISOString(),
          dataUrl: els.canvas.toDataURL('image/jpeg', FRAME_JPEG_QUALITY)
        };
        state.buffer.push(frame);
        state.assets.set(frame.uuid, frame);
        state.buffer = state.buffer.slice(-FRAME_BUFFER_MAX_FRAMES);
        void persistFrame(frame);
        return frame;
      }

      function persistFrame(frame) {
        if (state.persistedFrames.has(frame.uuid)) return Promise.resolve();
        const existing = state.framePersistPromises.get(frame.uuid);
        if (existing) return existing;

        const pending = fetch('/device/frames', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            device_frame_uuid: frame.uuid,
            captured_at: frame.capturedAt,
            mime_type: 'image/jpeg',
            data_url: frame.dataUrl
          })
        })
          .then((response) => {
            if (!response.ok) throw new Error(`Frame store returned ${response.status}`);
            state.persistedFrames.add(frame.uuid);
          })
          .catch((error) => {
            if (!state.frameStoreErrorLogged) {
              state.frameStoreErrorLogged = true;
              log('Device frame store failed', { error: error.message || String(error) });
            }
          })
          .finally(() => {
            state.framePersistPromises.delete(frame.uuid);
          });

        state.framePersistPromises.set(frame.uuid, pending);
        return pending;
      }

      async function persistFrames(frames) {
        await Promise.allSettled(frames.map((frame) => persistFrame(frame)));
      }

      function sendFrameToAgent() {
        if (!state.streaming || state.videoHidden) return;
        const frame = state.buffer.at(-1) || captureFrame();
        const base64 = frame.dataUrl.split(',')[1];
        send({
          type: 'user.media',
          modality: 'image',
          mime_type: 'image/jpeg',
          data: base64,
          seq: ++state.mediaSeq,
          timestamp: frame.capturedAt
        });
      }

      async function startAudioStreaming(stream) {
        const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
        const audioContext = new AudioContextCtor();
        await audioContext.resume();
        const audioStream = new MediaStream(stream.getAudioTracks());
        const source = audioContext.createMediaStreamSource(audioStream);
        const processor = audioContext.createScriptProcessor(4096, 1, 1);
        const mutedOutput = audioContext.createGain();
        mutedOutput.gain.value = 0;
        let pendingSamples = new Int16Array(0);

        processor.onaudioprocess = (event) => {
          event.outputBuffer.getChannelData(0).fill(0);
          if (!state.streaming || state.audioMuted) return;
          const input = event.inputBuffer.getChannelData(0);
          const pcm = downsampleToPcm16(input, audioContext.sampleRate, AUDIO_SAMPLE_RATE);
          pendingSamples = concatInt16(pendingSamples, pcm);
          while (pendingSamples.length >= AUDIO_CHUNK_SAMPLE_COUNT) {
            const chunk = pendingSamples.slice(0, AUDIO_CHUNK_SAMPLE_COUNT);
            pendingSamples = pendingSamples.slice(AUDIO_CHUNK_SAMPLE_COUNT);
            sendAudioPcmChunk(chunk);
          }
        };

        source.connect(processor);
        processor.connect(mutedOutput);
        mutedOutput.connect(audioContext.destination);
        state.audioStreamer = { audioContext, source, processor, mutedOutput };
      }

      function stopAudioStreaming() {
        const streamer = state.audioStreamer;
        if (!streamer) return false;
        streamer.processor.disconnect();
        streamer.source.disconnect();
        streamer.mutedOutput.disconnect();
        streamer.audioContext.close().catch(() => {});
        state.audioStreamer = null;
        return true;
      }

      function sendAudioPcmChunk(samples) {
        if (!samples.length) return;
        send({
          type: 'user.media',
          modality: 'audio',
          mime_type: `audio/pcm;rate=${AUDIO_SAMPLE_RATE}`,
          data: int16ToBase64(samples),
          seq: ++state.mediaSeq,
          timestamp: new Date().toISOString()
        });
      }

      function downsampleToPcm16(input, inputRate, outputRate) {
        const ratio = inputRate / outputRate;
        const outputLength = Math.max(1, Math.floor(input.length / ratio));
        const output = new Int16Array(outputLength);
        for (let i = 0; i < outputLength; i += 1) {
          const start = Math.floor(i * ratio);
          const end = Math.min(input.length, Math.floor((i + 1) * ratio));
          let sum = 0;
          for (let j = start; j < end; j += 1) sum += input[j];
          const sample = Math.max(-1, Math.min(1, sum / Math.max(1, end - start)));
          output[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
        }
        return output;
      }

      function concatInt16(a, b) {
        const output = new Int16Array(a.length + b.length);
        output.set(a, 0);
        output.set(b, a.length);
        return output;
      }

      function int16ToBase64(samples) {
        const bytes = new Uint8Array(samples.buffer, samples.byteOffset, samples.byteLength);
        let binary = '';
        for (let i = 0; i < bytes.length; i += 0x8000) {
          binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
        }
        return btoa(binary);
      }

      function toggleVideoHidden() {
        state.videoHidden = !state.videoHidden;
        for (const track of state.mediaStream?.getVideoTracks() ?? []) {
          track.enabled = !state.videoHidden;
        }
        els.video.style.visibility = state.videoHidden ? 'hidden' : 'visible';
        els.placeholder.style.display = state.videoHidden ? 'grid' : 'none';
        els.placeholder.textContent = state.videoHidden ? 'Camera hidden' : 'Start streaming to share camera and microphone.';
        if (state.videoHidden) {
          if (state.frameStreamTimer) {
            clearInterval(state.frameStreamTimer);
            state.frameStreamTimer = null;
          }
          send({ type: 'user.media_end', modality: 'image' });
        } else {
          captureFrame();
          sendFrameToAgent();
          scheduleFrameStreaming();
        }
        updateStreamControls();
      }

      function toggleAudioMuted() {
        state.audioMuted = !state.audioMuted;
        for (const track of state.mediaStream?.getAudioTracks() ?? []) {
          track.enabled = !state.audioMuted;
        }
        if (state.audioMuted) send({ type: 'user.media_end', modality: 'audio' });
        updateStreamControls();
      }

      function updateStreamControls() {
        els.hideVideo.textContent = state.videoHidden ? 'Show Camera' : 'Hide Camera';
        els.muteAudio.textContent = state.audioMuted ? 'Unmute Mic' : 'Mute Mic';
        els.hideVideo.classList.toggle('active', state.videoHidden);
        els.muteAudio.classList.toggle('active', state.audioMuted);
      }

      function withTimeout(promise, timeoutMs) {
        return Promise.race([
          promise,
          new Promise((_, reject) => {
            setTimeout(() => reject(new Error('permission-timeout')), timeoutMs);
          })
        ]);
      }

      async function handleServerMessage(message) {
        if (message.type === 'session.ready') {
          state.sessionId = message.session_id;
          log('Session ready', message);
          setSummary('Session ready', 'Realtime connection is active.', 'ok');
          return;
        }
        if (message.type === 'rewind.save_request') {
          protocolLog('rewind.save_request', message);
          setSummary('Saving rewind', `${message.title} · ${message.rewind_duration_seconds}s`, 'busy');
          renderSavedMemory(message, 0, 'uploading');
          void captureAndUploadRewind(message);
          return;
        }
        if (message.type === 'agent.media') {
          log('Agent media', {
            modality: message.modality,
            mime_type: message.mime_type,
            text: message.text,
            data_bytes_base64: message.data?.length
          });
          return;
        }
        if (message.type === 'rewind.search_results') {
          protocolLog('rewind.search_results', message);
          log('Search results', { query: message.query, results: message.results.length });
          setSummary('Search complete', `${message.results.length} result${message.results.length === 1 ? '' : 's'} for "${message.query}".`, 'ok');
          renderSearchResults(message);
          return;
        }
        if (message.type === 'error') {
          setSummary('Protocol error', message.error, 'error');
        }
        log(message.type, message);
      }

      async function captureAndUploadRewind(request) {
        try {
          if (!state.buffer.length) captureFrame();
          const requestedDurationMs = Math.max(1, Number(request.rewind_duration_seconds || DEFAULT_REWIND_CAPTURE_DURATION_SECONDS)) * 1000;
          const durationMs = Math.min(FRAME_BUFFER_DURATION_MS, requestedDurationMs);
          const frames = selectBufferedFrames(durationMs);
          await persistFrames(frames);
          renderSavedMemory(request, frames.length, 'uploading');
          const upload = {
            event_id: request.event_id,
            local_asset_id: `local-${request.event_id}`,
            thumbnail_frame_uuid: frames.at(-1)?.uuid,
            started_at: frames[0]?.capturedAt,
            ended_at: frames.at(-1)?.capturedAt,
            frames: frames.map((frame, index) => {
	              const payload = {
	                device_frame_uuid: frame.uuid,
	                local_asset_id: `local-${request.event_id}`,
	                captured_at: frame.capturedAt,
	                offset_ms: index * 1000
	              };
              if (request.include_frame_images) {
                payload.image_base64 = frame.dataUrl.split(',')[1];
                payload.mime_type = 'image/jpeg';
              }
              return payload;
            }),
            metadata: {
              rewind_duration_ms: durationMs,
              frame_embedding_mode: request.frame_embedding_mode || 'text_only'
            }
          };
          const response = await fetch(backendHttpUrl(request.upload_url), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-user-id': webConfig.DEV_USER_ID || '00000000-0000-4000-8000-000000000001',
              'x-device-id': webConfig.DEV_DEVICE_ID || 'dev-phone'
            },
            body: JSON.stringify(upload)
          });
          if (!response.ok) throw new Error(`Upload returned ${response.status}`);
          const result = await response.json();
          protocolLog('rewind.upload_complete', {
            event_id: result.event?.id || request.event_id,
            frame_count: result.frames?.length ?? frames.length
          });
          setSummary('Rewind saved', `${request.title} · ${result.frames?.length ?? frames.length} frames uploaded.`, 'ok');
          renderSavedMemory(request, result.frames?.length ?? frames.length, 'saved');
          renderTimeline(result.frames || upload.frames);
          log('Rewind uploaded', { event_id: result.event?.id || request.event_id, frames: result.frames?.length ?? frames.length });
        } catch (error) {
          setSummary('Rewind upload failed', error.message || String(error), 'error');
          renderSavedMemory(request, 0, 'failed');
          protocolLog('rewind.upload_failed', {
            event_id: request.event_id,
            error: error.message || String(error)
          });
        }
      }

      function selectBufferedFrames(durationMs) {
        const fallback = state.buffer.at(-1);
        if (!state.buffer.length) return fallback ? [fallback] : [];
        const lastTimestamp = Date.parse(state.buffer.at(-1).capturedAt);
        if (!Number.isFinite(lastTimestamp)) {
          return state.buffer.slice(-Math.max(1, Math.ceil(durationMs / LOCAL_FRAME_CAPTURE_INTERVAL_MS)));
        }
        const cutoff = lastTimestamp - durationMs;
        const selected = state.buffer.filter((frame) => {
          const captured = Date.parse(frame.capturedAt);
          return Number.isFinite(captured) && captured >= cutoff;
        });
        return selected.length ? selected : [state.buffer.at(-1)];
      }

      function renderTimeline(frameRefs) {
        stopPlayback();
        els.player.innerHTML = '';
        els.playbackInfo.innerHTML = '';
        els.frameList.innerHTML = '';
        const orderedRefs = [...frameRefs].sort((a, b) => {
          const aTime = Date.parse(a.captured_at || '') || Number(a.offset_ms ?? 0);
          const bTime = Date.parse(b.captured_at || '') || Number(b.offset_ms ?? 0);
          return aTime - bTime;
        }).map(normalizeFrameRef);
        if (!orderedRefs.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No frames selected.';
          els.player.appendChild(empty);
          state.playbackFrames = [];
          return;
        }

        state.playbackFrames = orderedRefs;
        state.playbackIndex = 0;
        const imageA = document.createElement('img');
        const imageB = document.createElement('img');
        imageA.alt = 'Rewind frame';
        imageB.alt = 'Rewind frame';
        els.player.append(imageA, imageB);

        const infoText = document.createElement('div');
        const infoTitle = document.createElement('strong');
        infoTitle.textContent = `${orderedRefs.length} frame${orderedRefs.length === 1 ? '' : 's'} in this rewind`;
        const infoDetail = document.createElement('span');
        infoDetail.textContent = 'Looping playback from the device frame cache.';
        infoText.append(infoTitle, infoDetail);
        els.playbackInfo.appendChild(infoText);

        orderedRefs.forEach((ref, index) => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = `frame-row${index === 0 ? ' active' : ''}`;
          item.onclick = () => {
            showPlaybackFrame(index, true);
            restartPlayback();
          };
          const img = document.createElement('img');
          img.src = ref.src;
          img.alt = `Frame ${index + 1}`;
          img.onerror = () => {
            img.remove();
            item.classList.add('missing');
          };
          const text = document.createElement('div');
          const label = document.createElement('small');
          label.textContent = `Frame ${index + 1}`;
          const time = document.createElement('div');
          time.className = 'frame-time';
          time.textContent = formatFrameTime(ref, index);
          text.append(label, time);
          item.append(img, text);
          els.frameList.appendChild(item);
        });

        showPlaybackFrame(0, false);
        restartPlayback();
      }

      function normalizeFrameRef(ref) {
        const frameUuid = ref.device_frame_uuid || ref.uuid;
        const frame = state.assets.get(frameUuid);
        return {
          ...ref,
          device_frame_uuid: frameUuid,
          src: frame?.dataUrl || deviceFrameImageUrl(frameUuid)
        };
      }

      function showPlaybackFrame(index, immediate) {
        if (!state.playbackFrames.length) return;
        state.playbackIndex = ((index % state.playbackFrames.length) + state.playbackFrames.length) % state.playbackFrames.length;
        const ref = state.playbackFrames[state.playbackIndex];
        const images = els.player.querySelectorAll('img');
        if (images.length < 2) return;
        const current = els.player.querySelector('img.visible');
        const next = current === images[0] ? images[1] : images[0];
        next.src = ref.src;
        next.alt = `Frame ${state.playbackIndex + 1}`;
        if (immediate) {
          for (const img of images) img.classList.remove('visible');
        }
        requestAnimationFrame(() => {
          next.classList.add('visible');
          for (const img of images) {
            if (img !== next) img.classList.remove('visible');
          }
        });
        for (const [rowIndex, row] of [...els.frameList.querySelectorAll('.frame-row')].entries()) {
          row.classList.toggle('active', rowIndex === state.playbackIndex);
        }
      }

      function restartPlayback() {
        stopPlayback();
        if (state.playbackFrames.length < 2) return;
        state.playbackTimer = setInterval(() => {
          showPlaybackFrame(state.playbackIndex + 1, false);
        }, PLAYBACK_INTERVAL_MS);
      }

      function stopPlayback() {
        if (!state.playbackTimer) return;
        clearInterval(state.playbackTimer);
        state.playbackTimer = null;
      }

      function formatFrameTime(ref, index) {
        if (ref.captured_at) {
          const date = new Date(ref.captured_at);
          if (!Number.isNaN(date.getTime())) return date.toLocaleTimeString();
        }
        if (ref.offset_ms != null) return `+${Math.round(Number(ref.offset_ms) / 1000)}s`;
        return `Frame ${index + 1}`;
      }

      function deviceFrameImageUrl(deviceFrameUuid) {
        return `/device/frames/${encodeURIComponent(deviceFrameUuid)}/image`;
      }

      async function runManualSearch(event) {
        event.preventDefault();
        const query = els.searchInput.value.trim();
        if (!query || state.searchBusy) return;
        if (!state.backendReady) {
          await checkBackendHealth();
          if (!state.backendReady) {
            setSummary('Search unavailable', 'Backend is disconnected.', 'error');
            return;
          }
        }

        state.searchBusy = true;
        updateStreamingControls();
        setSummary('Searching', query, 'busy');
        try {
          const response = await fetch(backendHttpUrl('/v1/rewinds/search'), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-user-id': webConfig.DEV_USER_ID || '00000000-0000-4000-8000-000000000001',
              'x-device-id': webConfig.DEV_DEVICE_ID || 'dev-phone'
            },
            body: JSON.stringify({
              query,
              limit: 10
            })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || `search ${response.status}`);
          protocolLog('http.rewind.search', result);
          log('Manual search results', { query: result.query, results: result.results?.length ?? 0 });
          setSummary('Search complete', `${result.results.length} result${result.results.length === 1 ? '' : 's'} for "${result.query}".`, 'ok');
          renderSearchResults(result);
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error);
          setSummary('Search failed', message, 'error');
          log('Manual search failed', { error: message });
        } finally {
          state.searchBusy = false;
          updateStreamingControls();
        }
      }

      function send(message) {
        if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
          log('Cannot send; WebSocket is not connected');
          return;
        }
        state.ws.send(JSON.stringify(message));
      }

      els.stream.onclick = () =>
        startStreaming().catch((error) => {
          const message = describeMediaError(error);
          updateStreamingControls();
          setStatus(`Streaming failed: ${message}`);
          log('Streaming failed', { name: error.name, error: message });
        });
      els.hideVideo.onclick = toggleVideoHidden;
      els.muteAudio.onclick = toggleAudioMuted;
      els.frameInterval.onchange = updateFrameInterval;
      els.frameInterval.oninput = updateFrameInterval;
      els.searchForm.onsubmit = runManualSearch;
      els.searchInput.oninput = updateStreamingControls;
      window.addEventListener('beforeunload', stopPlayback);
      checkBackendHealth();
      setInterval(checkBackendHealth, BACKEND_HEALTH_INTERVAL_MS);
    </script>
  </body>
</html>
