<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Desktop simulator for the Rewind Meta Ray-Ban Display HUD." />
    <title>Rewind Glasses Simulator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101312;
        color: #f4f7f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #101312;
      }

      .sim {
        width: min(100vw, 1100px);
        height: min(100vh, 720px);
        min-height: 600px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 240px;
        gap: 16px;
        padding: 16px;
      }

      .lens {
        position: relative;
        min-width: 0;
        overflow: hidden;
        border: 1px solid rgba(244, 247, 245, 0.18);
        background: #181c1a;
      }

      .world,
      video,
      .hud {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .world {
        background:
          linear-gradient(180deg, rgba(48, 58, 55, 0.18), transparent 42%),
          radial-gradient(circle at 28% 28%, rgba(190, 213, 206, 0.12), transparent 18%),
          linear-gradient(150deg, #202a27 0%, #161b1a 44%, #25221d 100%);
      }

      .world::before,
      .world::after {
        content: "";
        position: absolute;
        pointer-events: none;
      }

      .world::before {
        left: 8%;
        right: 8%;
        bottom: 12%;
        height: 32%;
        background:
          linear-gradient(90deg, rgba(226, 218, 200, 0.18), rgba(226, 218, 200, 0.06)),
          linear-gradient(180deg, rgba(255, 255, 255, 0.1), transparent 24%);
        transform: skewX(-8deg);
      }

      .world::after {
        top: 16%;
        right: 12%;
        width: 22%;
        height: 16%;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(120, 146, 132, 0.2);
        box-shadow:
          -360px 78px 0 -24px rgba(208, 120, 92, 0.18),
          -214px 194px 0 -18px rgba(122, 154, 196, 0.2),
          -70px 252px 0 -20px rgba(236, 220, 152, 0.16);
      }

      video {
        display: none;
        object-fit: cover;
      }

      .camera-on video {
        display: block;
      }

      .camera-on .world {
        display: none;
      }

      .hud {
        top: 50%;
        right: 8%;
        left: auto;
        bottom: auto;
        width: min(44vw, 600px);
        max-width: 600px;
        height: min(44vw, 600px);
        max-height: 600px;
        transform: translateY(-50%);
        border: 0;
        mix-blend-mode: screen;
        opacity: 0.96;
        pointer-events: none;
      }

      .lens-frame {
        position: absolute;
        inset: 26px 44px;
        pointer-events: none;
        border: 2px solid rgba(244, 247, 245, 0.2);
        border-radius: 44px;
        box-shadow:
          inset 0 0 36px rgba(0, 0, 0, 0.52),
          0 0 34px rgba(0, 0, 0, 0.34);
      }

      .display-box {
        position: absolute;
        top: 50%;
        right: 8%;
        width: min(44vw, 600px);
        max-width: 600px;
        aspect-ratio: 1;
        transform: translateY(-50%);
        border: 1px dashed rgba(140, 200, 255, 0.22);
        pointer-events: none;
      }

      .controls {
        border: 1px solid rgba(244, 247, 245, 0.18);
        background: #161b19;
        padding: 14px;
        display: grid;
        grid-template-rows: auto auto 1fr;
        gap: 12px;
        align-content: start;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #b8c4bf;
        font-size: 13px;
        line-height: 1.35;
      }

      button,
      a {
        min-height: 40px;
        border: 1px solid rgba(244, 247, 245, 0.22);
        background: #232c29;
        color: #f4f7f5;
        padding: 0 10px;
        font: inherit;
        text-decoration: none;
        display: inline-grid;
        place-items: center;
      }

      .stack {
        display: grid;
        gap: 8px;
      }

      .meta {
        color: #8cc8ff;
        font-size: 12px;
      }

      @media (max-width: 860px) {
        .sim {
          grid-template-columns: 1fr;
          height: auto;
          min-height: 100vh;
        }

        .lens {
          aspect-ratio: 16 / 10;
        }

        .controls {
          grid-template-rows: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="sim">
      <section id="lens" class="lens">
        <div class="world"></div>
        <video id="video" autoplay playsinline muted></video>
        <iframe class="hud" src="/glasses.html" title="Rewind glasses HUD"></iframe>
        <div class="lens-frame"></div>
        <div class="display-box"></div>
      </section>

      <aside class="controls">
        <h1>Rewind Display Simulator</h1>
        <p>The HUD is blended over the world view so black behaves like transparent glass.</p>
        <div class="stack">
          <button id="cameraButton" type="button">Start Camera</button>
          <a href="/glasses.html">Open HUD Only</a>
          <span id="status" class="meta">Synthetic world active</span>
        </div>
      </aside>
    </main>

    <script>
      const lens = document.getElementById('lens');
      const video = document.getElementById('video');
      const cameraButton = document.getElementById('cameraButton');
      const status = document.getElementById('status');
      let stream = null;

      async function toggleCamera() {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
          video.srcObject = null;
          lens.classList.remove('camera-on');
          cameraButton.textContent = 'Start Camera';
          status.textContent = 'Synthetic world active';
          return;
        }

        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' },
            audio: false
          });
          video.srcObject = stream;
          await video.play();
          lens.classList.add('camera-on');
          cameraButton.textContent = 'Stop Camera';
          status.textContent = 'Camera world active';
        } catch (error) {
          status.textContent = error?.message || 'Camera unavailable';
        }
      }

      cameraButton.onclick = toggleCamera;
    </script>
  </body>
</html>
