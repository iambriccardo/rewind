name: rewind-backend

services:
  rewind:
    build:
      context: .
    image: rewind-app:local
    container_name: rewind-app
    restart: unless-stopped
    ports:
      - "${REWIND_PORT:-8787}:8787"
    env_file:
      - ${REWIND_BACKEND_ENV_FILE:-.env.backend}
    environment:
      HOST: 0.0.0.0
      PORT: 8787
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://127.0.0.1:8787/health >/dev/null"
      interval: 10s
      timeout: 3s
      retries: 12
